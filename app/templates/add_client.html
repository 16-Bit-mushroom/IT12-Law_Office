{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Add New Client</h4>
                    <p class="text-muted mb-0">Create a new client profile to start transactions</p>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('clients.submit_new_client') }}">
                        <!-- Name Fields -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="client_first_name" class="form-label">First Name *</label>
                                    <input type="text" class="form-control" id="client_first_name" name="client_first_name" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="client_last_name" class="form-label">Last Name *</label>
                                    <input type="text" class="form-control" id="client_last_name" name="client_last_name" required>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Contact Information -->
                        <div class="mb-3">
                            <label for="client_email" class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="client_email" name="client_email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="client_phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="client_phone" name="client_phone" placeholder="+63 XXX XXX XXXX">
                        </div>
                        
                        <div class="mb-3">
                            <label for="client_address" class="form-label">Address *</label>
                            <textarea class="form-control" id="client_address" name="client_address" rows="3" required placeholder="Full street address including city and province"></textarea>
                        </div>
                        
                        <!-- Client Type -->
                        <div class="mb-3">
                            <label for="client_role" class="form-label">Client Type *</label>
                            <select class="form-control" id="client_role" name="client_role" required>
                                <option value="">Select client type...</option>
                                <option value="Individual">Individual</option>
                                <option value="Corporate">Corporate/Business</option>
                                <option value="Notary Client">Notary Client</option>
                                <option value="Legal Client">Legal Client</option>
                            </select>
                        </div>
                        
                        <!-- Additional Information -->
                        <div class="mb-3">
                            <label for="internal_notes" class="form-label">Internal Notes</label>
                            <textarea class="form-control" id="internal_notes" name="internal_notes" rows="3" placeholder="Any additional information about the client..."></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('clients.clients_page') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Add Client & Start Transaction</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
