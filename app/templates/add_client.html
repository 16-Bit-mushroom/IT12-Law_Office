{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-9">
            
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 border-0">
                    <h4 class="mb-0 fw-bold text-dark">Add New Client</h4>
                    <p class="text-muted small mb-0">Create a profile to associate with cases.</p>
                    <hr class="mt-3 mb-0">
                </div>

                <div class="card-body pt-2">
                    <form method="POST" action="{{ url_for('clients.submit_new_client') }}" id="clientForm">
                        
                        <div class="d-flex justify-content-center mb-4">
                            <div class="bg-light p-1 rounded-pill d-inline-flex border">
                                <input type="radio" class="btn-check" name="client_type" id="type_individual" value="individual" checked onchange="toggleClientType()">
                                <label class="btn btn-sm btn-outline-primary rounded-pill px-3 border-0 fw-bold" for="type_individual">Individual</label>

                                <input type="radio" class="btn-check" name="client_type" id="type_corporate" value="corporate" onchange="toggleClientType()">
                                <label class="btn btn-sm btn-outline-primary rounded-pill px-3 border-0 fw-bold" for="type_corporate">Corporate / Entity</label>
                            </div>
                        </div>

                        <div id="section_individual">
                            <h6 class="text-uppercase text-muted small fw-bold mb-3">Personal Details</h6>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold">First Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="first_name" id="req_fname" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold">Middle Name</label>
                                    <input type="text" class="form-control" name="middle_name">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold">Last Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="last_name" id="req_lname" required>
                                </div>
                            </div>
                        </div>

                        <div id="section_corporate" style="display: none;">
                            <h6 class="text-uppercase text-muted small fw-bold mb-3">Corporate Details</h6>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Registered Company Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="company_name" id="req_company">
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Tax ID (TIN)</label>
                                    <input type="text" class="form-control" name="tax_id">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold">Designated Representative</label>
                                    <input type="text" class="form-control" name="representative" placeholder="e.g. John Doe (Manager)">
                                </div>
                            </div>
                        </div>

                        <h6 class="text-uppercase text-muted small fw-bold mt-4 mb-3">Contact Info</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Phone Number</label>
                                <input type="text" class="form-control" name="phone">
                            </div>
                        </div>

                        <h6 class="text-uppercase text-muted small fw-bold mt-4 mb-3">Address</h6>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Street / Building / House No. *</label>
                            <input type="text" class="form-control" name="street_address" required>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Barangay</label>
                                <input type="text" class="form-control" name="barangay">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">City / Municipality *</label>
                                <input type="text" class="form-control" name="city" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Province</label>
                                <input type="text" class="form-control" name="province">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Zip Code</label>
                                <input type="text" class="form-control" name="zip_code">
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                            <a href="{{ url_for('case.list_cases') }}" class="btn btn-light text-muted">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">Create Client Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleClientType() {
        const isIndividual = document.getElementById('type_individual').checked;
        const indSection = document.getElementById('section_individual');
        const corpSection = document.getElementById('section_corporate');
        
        // Toggle Required Fields
        document.getElementById('req_fname').required = isIndividual;
        document.getElementById('req_lname').required = isIndividual;
        document.getElementById('req_company').required = !isIndividual;

        // Toggle Visibility
        indSection.style.display = isIndividual ? 'block' : 'none';
        corpSection.style.display = isIndividual ? 'none' : 'block';
    }
</script>
{% endblock %}
