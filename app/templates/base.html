<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ✅ Local Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <title>RBJ Law Office</title>
</head>

<!-- ✅ Bootstrap JS Bundle (includes Popper) -->
<script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>


<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="{{ url_for('static', filename='img/scales-of-justice.svg') }}" alt="logo">
            <h2>RBJ Law</h2>
        </div>

        <ul class="sidebar-links">

            <li><a href="{{ url_for('dashboard.dashboard_page') }}"><span><img
                            src="{{ url_for('static', filename='img/dashboard.svg') }}" alt=""></span>Dashboard</a></li>

            <li><a href="{{ url_for('case_logs.case_logs_page') }}"><span><img
                            src="{{ url_for('static', filename='img/cases.svg') }}" alt=""></span>Case Logs</a></li>

            <li><a href="{{ url_for('notarial_entries.notarial_entries_page') }}"><span><img
                            src="{{ url_for('static', filename='img/book.svg') }}" alt=""></span>Notarial
                    Entries</a> </li>

            <!-- <li><a href="{{ url_for('legal_consultation.legal_consultation_page') }}"><span><img
                            src="{{ url_for('static', filename='img/consult.svg') }}" alt=""></span>Legal
                    Consultation</a>
            </li> -->

            <li><a href="{{ url_for('documents.documents_page') }}"><span><img
                            src="{{ url_for('static', filename='img/documents.svg') }}" alt=""></span>Documents</a></li>

            <!-- REPLACE the four separate links with this block -->
            <li class="has-submenu">
                <button class="submenu-toggle" aria-expanded="false" aria-haspopup="true">
                    <span><img src="{{ url_for('static', filename='img/more.svg') }}" alt=""></span>
                    More
                    <span class="chev" aria-hidden="true">▾</span>
                </button>

                <ul class="submenu" role="menu" aria-label="More links">
                    <li role="none"><a role="menuitem" href="{{ url_for('transaction.transactions_page') }}">
                            <span><img style="width: 28px;" src="{{ url_for('static', filename='img/transaction.svg') }}"
                                    alt=""></span>Transactions
                        </a></li>

                    <!-- <li role="none"><a role="menuitem" href="{{ url_for('clients.clients_page') }}">
                            <span><img style="width: 28px;" src="{{ url_for('static', filename='img/clients.svg') }}" alt=""></span>Clients
                        </a></li> -->
                        

                    <li role="none"><a role="menuitem" href="#">
                            <span><img style="width: 28px;" src="{{ url_for('static', filename='img/service.svg') }}" alt=""></span>Services
                        </a></li>

                    <li role="none"><a role="menuitem" href="{{ url_for('payments.payments_page') }}">
                            <span><img style="width: 28px;" src="{{ url_for('static', filename='img/payments.svg') }}" alt=""></span>Payments
                        </a></li>
                </ul>
            </li>
            </li>



        </ul>

        <div class="sidebar-footer">
            <button class="avatar-btn" id="avatarBtn">
                <img src="{{ url_for('static', filename='img/avatar.svg') }}" alt="User Avatar">
                <span>Atty. Chris</span>
            </button>
            <div class="avatar-dropdown" id="avatarDropdown">
                <a href="{{ url_for('admin.admin_page') }}">My Account</a>
                <a href="{{ url_for('admin.manage_users_page') }}">Manage Users</a>
                <a href="#">Settings</a>
                <li><a href="{{ url_for('auth.logout') }}"><span><img>Log Out</a>
            </div>
        </div>



    </aside>

    <div class="page-container">
        {% block content %}
        <!-- Page content (from child templates) goes here -->
        {% endblock %}
    </div>

</body>

<script>
    const avatarBtn = document.getElementById('avatarBtn');
    const avatarDropdown = document.getElementById('avatarDropdown');

    avatarBtn.addEventListener('click', () => {
        avatarDropdown.style.display = avatarDropdown.style.display === 'flex' ? 'none' : 'flex';
    });

    // Close dropdown if clicked outside
    document.addEventListener('click', (e) => {
        if (!avatarBtn.contains(e.target) && !avatarDropdown.contains(e.target)) {
            avatarDropdown.style.display = 'none';
        }
    });

    // Submenu toggle for touch / click devices
    document.addEventListener('DOMContentLoaded', () => {
        const submenuToggles = document.querySelectorAll('.submenu-toggle');

        submenuToggles.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // prevent link-like behavior if you later convert to <a>
                e.preventDefault();

                const li = btn.closest('.has-submenu');
                const isShown = li.classList.toggle('show');    // toggles .show which CSS uses
                btn.setAttribute('aria-expanded', isShown ? 'true' : 'false');
            });
        });

        // Close any open submenu when clicking outside
        document.addEventListener('click', (e) => {
            submenuToggles.forEach(btn => {
                const li = btn.closest('.has-submenu');
                if (!li.contains(e.target)) {
                    li.classList.remove('show');
                    btn.setAttribute('aria-expanded', 'false');
                }
            });
        });

        // Close with Escape key for accessibility
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                submenuToggles.forEach(btn => {
                    const li = btn.closest('.has-submenu');
                    li.classList.remove('show');
                    btn.setAttribute('aria-expanded', 'false');
                });
            }
        });
    });

</script>


</html>
