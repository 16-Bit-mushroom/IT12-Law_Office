<!-- templates/cases/create.html -->
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Create New Case</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('case.create_case') }}" id="caseForm">
                        <!-- Client Selection -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">Client Information</h5>
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="mb-3">
                                        <label for="client_id" class="form-label">Select Client *</label>
                                        <select class="form-control" id="client_id" name="client_id" required>
                                            <option value="">Choose a client...</option>
                                            {% for client in clients %}
                                            <option value="{{ client.id }}" 
                                                {% if pre_select_client_id and client.id == pre_select_client_id %}selected{% endif %}>
                                                {{ client.full_name }} - {{ client.email }}
                                            </option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4 d-flex align-items-end">
                                    <a href="{{ url_for('clients.new_client_form') }}" class="btn btn-outline-primary w-100">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;">
                                            <line x1="12" y1="5" x2="12" y2="19"></line>
                                            <line x1="5" y1="12" x2="19" y2="12"></line>
                                        </svg>
                                        Add New Client
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Case Category -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">Case Category</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="case_category" id="individual" value="individual" checked>
                                        <label class="form-check-label" for="individual">
                                            Individual Case
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="case_category" id="corporate" value="corporate">
                                        <label class="form-check-label" for="corporate">
                                            Corporate Case
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Case Details -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">Case Details</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="title" class="form-label">Case Title *</label>
                                        <input type="text" class="form-control" id="title" name="title" required
                                            placeholder="e.g., Smith vs. Johnson Contract Dispute">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="case_type" class="form-label">Case Type *</label>
                                        <select class="form-control" id="case_type" name="case_type" required>
                                            <option value="">Select case type...</option>
                                            <option value="civil">Civil Case</option>
                                            <option value="criminal">Criminal Case</option>
                                            <option value="corporate">Corporate</option>
                                            <option value="family">Family Law</option>
                                            <option value="property">Property</option>
                                            <option value="labor">Labor</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="violation" class="form-label">Violation / Cause of Action</label>
                                <input type="text" class="form-control" id="violation" name="violation"
                                    placeholder="e.g., Breach of Contract, Theft, etc.">
                            </div>
                        </div>

                        <!-- Representatives Section -->
                        <div class="mb-4" id="representativesSection">
                            <h5 class="border-bottom pb-2">Representatives</h5>
                            <p class="text-muted">Add representatives for this case (optional)</p>
                            
                            <div id="representativesContainer">
                                <!-- Representative template -->
                                <div class="representative-entry card mb-3">
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-4">
                                                <div class="mb-3">
                                                    <label class="form-label">Full Name</label>
                                                    <input type="text" class="form-control" name="representative_name[]" placeholder="Full name">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="mb-3">
                                                    <label class="form-label">Email</label>
                                                    <input type="email" class="form-control" name="representative_email[]" placeholder="Email">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="mb-3">
                                                    <label class="form-label">Phone</label>
                                                    <input type="text" class="form-control" name="representative_phone[]" placeholder="Phone">
                                                </div>
                                            </div>
                                            <div class="col-md-2">
                                                <div class="mb-3">
                                                    <label class="form-label">Role</label>
                                                    <input type="text" class="form-control" name="representative_role[]" placeholder="Role">
                                                </div>
                                            </div>
                                        </div>
                                        <button type="button" class="btn btn-sm btn-outline-danger remove-representative">Remove</button>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="button" class="btn btn-outline-primary" id="addRepresentative">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                Add Representative
                            </button>
                        </div>

                        <!-- Dates -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">Case Dates</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="engagement_date" class="form-label">Engagement Date *</label>
                                        <input type="date" class="form-control" id="engagement_date" name="engagement_date" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="filing_date" class="form-label">Filing Date (if applicable)</label>
                                        <input type="date" class="form-control" id="filing_date" name="filing_date">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('case.list_cases') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Create Case</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Set today's date as default for engagement date
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('engagement_date').value = today;

        // Representatives management
        const representativesContainer = document.getElementById('representativesContainer');
        const addRepresentativeBtn = document.getElementById('addRepresentative');

        // Add representative
        addRepresentativeBtn.addEventListener('click', function() {
            const newEntry = representativesContainer.children[0].cloneNode(true);
            // Clear input values
            newEntry.querySelectorAll('input').forEach(input => input.value = '');
            representativesContainer.appendChild(newEntry);
            updateRemoveButtons();
        });

        // Remove representative
        function updateRemoveButtons() {
            document.querySelectorAll('.remove-representative').forEach(button => {
                button.addEventListener('click', function() {
                    if (representativesContainer.children.length > 1) {
                        this.closest('.representative-entry').remove();
                    } else {
                        // If it's the last one, just clear the inputs
                        this.closest('.representative-entry').querySelectorAll('input').forEach(input => input.value = '');
                    }
                });
            });
        }

        // Initial setup for remove buttons
        updateRemoveButtons();
    });
</script>
{% endblock %}
