<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/app/static/css/main.css">
    <title>Document</title>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="/app/static/img/scales-of-justice.png" alt="logo">
            <h2>RJB Law</h2>
        </div>

        <ul class="sidebar-links">
            <li><a href="dashboard_page.html"><span><img src="/app/static/img/dashboard.svg" alt=""></span>Dashboard</a></li>
            <li><a href="clients_page.html"><span><img src="/app/static/img/clients.svg" alt=""></span>Clients</a></li>
            <li><a href="documents_page.html"><span><img src="/app/static/img/documents.svg" alt=""></span>Documents</a></li>
            <li><a href="case_logs_page.html"><span><img src="/app/static/img/cases.svg" alt=""></span>Case Logs</a></li>
            <li><a href="payments_page.html"><span><img src="/app/static/img/payments.svg" alt=""></span>Payments</a></li>
        </ul>

        <!-- <div class="user-account">
            <div class="user-profile">
                <img src="/app/static/img/profile.svg" alt="profile">
                <p>Admin</p>
            </div>
        </div> -->
    </aside>

    <div class="page-container">

        <header class="top-bar">
            <div class="search-bar">
                <svg class="search-bar__icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input class="search-bar__input" type="text" placeholder="Search documents, clients, cases...">
            </div>
        </header>

        <main class="dashboard-content">
            <header class="dashboard-header">
                <h1>Clients</h1>
                <p>Manage all your clients and relationships</p>
            </header>

            <section class="dashboard-cards">

                <div class="data-card">
                    <div class="data-card__info">
                        <span class="data-card__title">Total Documents</span>
                        <span class="data-card__value">1243</span>
                    </div>
                    <div class="data-card__icon data-card__icon--blue"></div>
                </div>

                <div class="data-card">
                    <div class="data-card__info">
                        <span class="data-card__title">Pending Review</span>
                        <span class="data-card__value">23</span>
                    </div>
                    <div class="data-card__icon data-card__icon--gold"></div>
                </div>

                <div class="data-card">
                    <div class="data-card__info">
                        <span class="data-card__title">Completed</span>
                        <span class="data-card__value">1198</span>
                    </div>
                    <div class="data-card__icon data-card__icon--green"></div>
                </div>

            </section>
        </main>

    </div>
</body>

</html>
