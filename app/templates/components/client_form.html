<!-- Bootstrap Modal for Client Form -->
<div class="modal fade" id="clientFormModal" tabindex="-1" aria-labelledby="clientFormLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="clientForm">
        <div class="modal-header">
          <h5 class="modal-title" id="clientFormLabel">Add / Edit Client</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="clientName" class="form-label">Name</label>
              <input type="text" class="form-control" id="clientName" name="name" required>
            </div>

            <div class="col-md-6">
              <label for="clientType" class="form-label">Type</label>
              <select class="form-select" id="clientType" name="type" required>
                <option selected disabled>Choose Type</option>
                <option value="Individual">Individual</option>
                <option value="Company">Company</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="clientContact" class="form-label">Contact</label>
              <input type="text" class="form-control" id="clientContact" name="contact" required>
            </div>

            <div class="col-md-6">
              <label for="clientStatus" class="form-label">Status</label>
              <select class="form-select" id="clientStatus" name="status" required>
                <option selected>Active</option>
                <option>Inactive</option>
              </select>
            </div>

            <div class="col-12">
              <label for="clientNotes" class="form-label">Notes</label>
              <textarea class="form-control" id="clientNotes" name="notes" rows="3"></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
