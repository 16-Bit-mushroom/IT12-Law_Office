<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="alternate" href="atom.xml" type="application/atom+xml" title="Atom">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}">

    <title>Login | RJB Law Office</title>
</head>
<body class="gradient-background">
    <section class="vh-100 d-flex justify-content-center align-items-center">
        <div class="container-fluid p-0">
            <div class="row g-0 justify-content-center">
                
                <div class="col-md-10 col-lg-6 col-xl-4 text-black login-card-container">

                    <div class="text-center mb-5 mt-4 brand-header">
                        <i class="fas fa-balance-scale fa-2x brand-icon"></i>
                        <span class="h1 fw-bold mb-0 brand-text">RJB Law Office</span>
                    </div>

                    <div class="d-flex justify-content-center px-4">

                        <form method="POST" action="{{ url_for('auth.login') }}" class="login-form-wrapper p-5">

                            <h3 class="fw-bold mb-3 form-heading text-center">Welcome Back</h3>
                            <p class="text-muted mb-4 subtitle text-center">Please enter your details to access the firm portal.</p>

                            {% with messages = get_flashed_messages(with_categories=true) %}
                                {% if messages %}
                                    {% for category, message in messages %}
                                        <div class="alert alert-{{ category }} alert-dismissible fade show custom-alert" role="alert">
                                            {{ message }}
                                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                        </div>
                                    {% endfor %}
                                {% endif %}
                            {% endwith %}

                            <div class="form-group mb-4">
                                <label class="form-label" for="form2Example18">Email Address</label>
                                <input type="email" id="form2Example18" name="email" class="form-control form-control-lg custom-input" required value="admin@lawoffice.com" placeholder="name@company.com" />
                            </div>

                            <div class="form-group mb-4">
                                <label class="form-label" for="form2Example28">Password</label>
                                <input type="password" id="form2Example28" name="password" class="form-control form-control-lg custom-input" required value="password123" placeholder="Enter your password" />
                            </div>

                            <div class="pt-1 mb-4">
                                <button class="btn btn-lg btn-block custom-btn-primary" type="submit">Sign In</button>
                            </div>


                        </form>
                        </div>

                </div>
            </div>
        </div>
    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
