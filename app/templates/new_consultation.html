{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">New Legal Consultation</h4>
                    <p class="text-muted mb-0">Record a legal consultation session</p>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('legal_consultation.submit_new_consultation') }}">
                        <!-- Client Selection -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">Client Information</h5>
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="mb-3">
                                        <label for="client_id" class="form-label">Select Client *</label>
                                        <select class="form-control" id="client_id" name="client_id" required>
                                            <option value="">Choose a client...</option>
                                            {% for client in clients %}
                                            <option value="{{ client.id }}">
                                                {{ client.full_name }} - {{ client.client_email }}
                                            </option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4 d-flex align-items-end">
                                    <a href="{{ url_for('clients.new_client_form') }}?return_to=legal_consultation" class="btn btn-outline-primary w-100">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;">
                                            <line x1="12" y1="5" x2="12" y2="19"></line>
                                            <line x1="5" y1="12" x2="19" y2="12"></line>
                                        </svg>
                                        Add New Client
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Consultation Details -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">Consultation Details</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="consultation_type" class="form-label">Consultation Type *</label>
                                        <select class="form-control" id="consultation_type" name="consultation_type" required>
                                            <option value="">Select type...</option>
                                            <option value="Initial">Initial Consultation</option>
                                            <option value="Follow-up">Follow-up Consultation</option>
                                            <option value="Emergency">Emergency Consultation</option>
                                            <option value="Case Review">Case Review</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="consultation_duration" class="form-label">Duration (minutes) *</label>
                                        <input type="number" class="form-control" id="consultation_duration" name="consultation_duration" min="15" max="480" step="15" value="60" required>
                                        <small class="form-text text-muted">Consultation duration in minutes</small>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="consultation_topic" class="form-label">Consultation Topic *</label>
                                <input type="text" class="form-control" id="consultation_topic" name="consultation_topic" required placeholder="e.g., Contract dispute, Family law matter, Business incorporation...">
                            </div>
                            
                            <div class="mb-3">
                                <label for="consultation_notes" class="form-label">Consultation Notes *</label>
                                <textarea class="form-control" id="consultation_notes" name="consultation_notes" rows="4" required placeholder="Detailed notes from the consultation session..."></textarea>
                            </div>
                        </div>

                        <!-- Legal Analysis -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">Legal Analysis</h5>
                            <div class="mb-3">
                                <label for="legal_issues" class="form-label">Legal Issues Identified</label>
                                <textarea class="form-control" id="legal_issues" name="legal_issues" rows="3" placeholder="Key legal issues discussed..."></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="recommendations" class="form-label">Legal Recommendations</label>
                                <textarea class="form-control" id="recommendations" name="recommendations" rows="3" placeholder="Legal advice and recommendations provided..."></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="next_steps" class="form-label">Next Steps</label>
                                <textarea class="form-control" id="next_steps" name="next_steps" rows="2" placeholder="Recommended next actions..."></textarea>
                            </div>
                        </div>

                        <!-- Follow-up -->
                        <div class="mb-4">
                            <h5 class="border-bottom pb-2">Follow-up</h5>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="follow_up_required" name="follow_up_required">
                                    <label class="form-check-label" for="follow_up_required">
                                        Follow-up consultation required
                                    </label>
                                </div>
                            </div>
                            
                            <div class="mb-3" id="follow_up_date_field" style="display: none;">
                                <label for="follow_up_date" class="form-label">Follow-up Date</label>
                                <input type="date" class="form-control" id="follow_up_date" name="follow_up_date">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('legal_consultation.legal_consultation_page') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Record Consultation</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const followUpCheckbox = document.getElementById('follow_up_required');
    const followUpDateField = document.getElementById('follow_up_date_field');
    
    followUpCheckbox.addEventListener('change', function() {
        if (this.checked) {
            followUpDateField.style.display = 'block';
            // Set default follow-up date to 1 week from now
            const nextWeek = new Date();
            nextWeek.setDate(nextWeek.getDate() + 7);
            document.getElementById('follow_up_date').value = nextWeek.toISOString().split('T')[0];
        } else {
            followUpDateField.style.display = 'none';
            document.getElementById('follow_up_date').value = '';
        }
    });
});
</script>
{% endblock %}
