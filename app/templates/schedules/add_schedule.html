{% extends 'base.html' %}

{% block content %}
<main class="dashboard-content">
    <header class="dashboard-header">
        <div>
            <h1>Add Schedule Task</h1>
            <p>For Case: <code>{{ case.case_number }}</code> - {{ case.title }}</p>
        </div>
        <div class="dashboard-actions">
            <a href="{{ url_for('case.view_case', case_id=case.id) }}" class="btn btn-secondary">
                ← Back to Case
            </a>
        </div>
    </header>

    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="panel-card">
                <h5 class="panel-card__title">Task Details</h5>
                
                <form method="POST" action="{{ url_for('case.add_schedule_submission', case_id=case.id) }}">
                    
                    <div class="mb-3">
                        <label class="form-label">Task Title *</label>
                        <input type="text" class="form-control" name="title" required placeholder="e.g., Court Submission">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Details (Optional)</label>
                        <textarea class="form-control" name="details" rows="2" placeholder="Add specific instructions or notes..."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Deadline *</label>
                            <input type="date" class="form-control" name="deadline" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-control" name="priority">
                                <option value="normal">Normal</option>
                                <option value="high">Urgent</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mt-3 text-end">
                        <button type="submit" class="btn btn-primary">Save Schedule</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
