{% extends 'base.html' %}

{% block content %}
<main class="dashboard-content">
    <header class="dashboard-header">
        <div>
            <h1>Edit Task</h1>
            <p>For Case: <code>{{ case.case_number }}</code> - {{ case.title }}</p>
        </div>
        <div class="dashboard-actions">
            <a href="{{ url_for('case.view_case', case_id=case.id) }}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </header>

    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="panel-card">
                <h5 class="panel-card__title">Edit Details</h5>

                <form method="POST"
                    action="{{ url_for('case.edit_schedule_submission', case_id=case.id, schedule_id=schedule.id) }}">

                    <div class="mb-3">
                        <label class="form-label">Task Title *</label>
                        <input type="text" class="form-control" name="title" value="{{ schedule.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Details</label>
                        <textarea class="form-control" name="details" rows="2">{{ schedule.details or '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Deadline *</label>
                            <input type="date" class="form-control" 
                                   name="deadline" 
                                   id="deadlineInput" 
                                   value="{{ schedule.deadline }}" 
                                   data-original="{{ schedule.deadline }}"
                                   required 
                                   onchange="checkDateChange()">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-control" name="priority">
                                <option value="normal" {% if schedule.priority=='normal' %}selected{% endif %}>Normal</option>
                                <option value="high" {% if schedule.priority=='high' %}selected{% endif %}>Urgent</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3" id="reasonField"
                        style="display: none; background-color: #fff3cd; padding: 15px; border-radius: 8px; border: 1px solid #ffeeba;">
                        <label class="form-label text-warning-emphasis fw-bold">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i> Reason for Moving Date *
                        </label>
                        <input type="text" class="form-control" name="change_reason" id="changeReasonInput"
                            placeholder="e.g., Court rescheduled due to judge's absence">
                        <div class="form-text text-muted">Required when changing the deadline.</div>
                    </div>

                    <div class="mt-3 text-end">
                        <button type="submit" class="btn btn-primary">Update Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    function checkDateChange() {
        const input = document.getElementById('deadlineInput');
        const reasonField = document.getElementById('reasonField');
        const reasonInput = document.getElementById('changeReasonInput');
        
        // Get original date from data attribute
        const originalDate = input.getAttribute('data-original');
        
        // Compare values
        if (input.value !== originalDate) {
            reasonField.style.display = 'block';
            reasonInput.required = true;
        } else {
            reasonField.style.display = 'none';
            reasonInput.required = false;
            reasonInput.value = ''; // Clear if reverted
        }
    }
</script>
{% endblock %}
