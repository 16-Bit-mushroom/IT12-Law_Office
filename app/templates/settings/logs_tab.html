<!-- templates/settings/logs_tab.html -->
<div class="panel-card">
    <header class="panel-card__header">
        <h3 class="panel-card__title">System Activity Logs</h3>
        <div class="log-filters">
            <select class="form-select" style="margin-block: 15px;">
                <option>Last 7 days</option>
                <option>Last 30 days</option>
                <option>Last 90 days</option>
                <option>All time</option>
            </select>
        </div>
    </header>

    <div class="panel-card__body">
        <div class="log-entries">
            <div class="log-entry">
                <div class="log-entry__icon log-entry__icon--info">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                </div>
                <div class="log-entry__content">
                    <p class="log-entry__text">User <strong>John Doe</strong> logged in</p>
                    <span class="log-entry__time">2 hours ago</span>
                </div>
            </div>

            <div class="log-entry">
                <div class="log-entry__icon log-entry__icon--warning">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="log-entry__content">
                    <p class="log-entry__text">Case <strong>Smith vs. Jones</strong> status changed to Completed</p>
                    <span class="log-entry__time">5 hours ago</span>
                </div>
            </div>

            <div class="log-entry">
                <div class="log-entry__icon log-entry__icon--success">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
                <div class="log-entry__content">
                    <p class="log-entry__text">Document <strong>Property Deed Transfer.pdf</strong> uploaded</p>
                    <span class="log-entry__time">1 day ago</span>
                </div>
            </div>

            <div class="log-entry">
                <div class="log-entry__icon log-entry__icon--danger">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </div>
                <div class="log-entry__content">
                    <p class="log-entry__text">Client <strong>Robert Wilson</strong> was deleted</p>
                    <span class="log-entry__time">2 days ago</span>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .log-filters {
        display: flex;
        gap: 1rem;
    }

    .log-entries {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .log-entry {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        padding: 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
    }

    .log-entry__icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .log-entry__icon--info {
        background-color: #dbeafe;
        color: #1d4ed8;
    }

    .log-entry__icon--warning {
        background-color: #fef3c7;
        color: #d97706;
    }

    .log-entry__icon--success {
        background-color: #d1fae5;
        color: #065f46;
    }

    .log-entry__icon--danger {
        background-color: #fee2e2;
        color: #dc2626;
    }

    .log-entry__content {
        flex: 1;
    }

    .log-entry__text {
        margin: 0 0 0.25rem 0;
        color: #1e293b;
    }

    .log-entry__time {
        font-size: 0.875rem;
        color: #64748b;
    }

    .form-select {
        padding: 0.5rem 2rem 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
        background-color: white;
        font-size: 0.875rem;
        color: #374151;
        cursor: pointer;
    }
</style>
