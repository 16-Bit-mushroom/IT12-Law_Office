<div class="panel-card">
    <header class="panel-card__header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 class="panel-card__title">Recycle Bin</h3>
            <button class="btn btn-outline-secondary btn-sm" onclick="loadRecycleData()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                Refresh
            </button>
        </div>
    </header>

    <div class="panel-card__body">
        
        <div class="recycle-tabs">
            <button class="recycle-tab-btn active" onclick="switchRecycleTab('all', this)">All Items</button>
            <button class="recycle-tab-btn" onclick="switchRecycleTab('clients', this)">Clients</button>
            <button class="recycle-tab-btn" onclick="switchRecycleTab('cases', this)">Cases</button>
            <button class="recycle-tab-btn" onclick="switchRecycleTab('documents', this)">Documents</button>
            <button class="recycle-tab-btn" onclick="switchRecycleTab('notarial', this)">Notarial</button>
        </div>

        <div id="recycleListContainer" class="recycle-list">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                <span class="ms-2">Loading deleted items...</span>
            </div>
        </div>

    </div>
</div>

<style>
    /* Tab Filters Style */
    .recycle-tabs {
        display: flex;
        gap: 8px;
        padding-bottom: 15px;
        margin-bottom: 15px;
        border-bottom: 1px solid #f0f0f0;
        overflow-x: auto;
    }

    .recycle-tab-btn {
        background: none;
        border: 1px solid #e5e7eb;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 500;
        color: #6b7280;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
    }

    .recycle-tab-btn:hover {
        background-color: #f9fafb;
        color: #1f2937;
        border-color: #d1d5db;
    }

    .recycle-tab-btn.active {
        background-color: #eff6ff;
        color: #2563eb;
        border-color: #bfdbfe;
        font-weight: 600;
    }

    /* List Item Style */
    .recycle-card {
        display: flex;
        align-items: center;
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin-bottom: 10px;
        background: #fff;
        transition: box-shadow 0.2s;
    }

    .recycle-card:hover {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        border-color: #d1d5db;
    }

    .recycle-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background-color: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6b7280;
        margin-right: 16px;
        flex-shrink: 0;
    }

    .recycle-content {
        flex-grow: 1;
        min-width: 0;
    }

    .recycle-title {
        font-weight: 600;
        color: #111827;
        margin-bottom: 2px;
        display: block;
        text-decoration: none;
    }
    
    .recycle-title:hover {
        text-decoration: underline;
        color: #2563eb;
    }

    .recycle-meta {
        font-size: 0.8rem;
        color: #6b7280;
    }

    .recycle-actions {
        display: flex;
        gap: 8px;
        margin-left: 16px;
    }

    /* Type Badges */
    .badge-type {
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        background: #f3f4f6;
        color: #4b5563;
        border: 1px solid #e5e7eb;
        margin-right: 6px;
        text-transform: uppercase;
        font-weight: 600;
    }
</style>

<script>
    let currentCategory = 'all';

    // Auto-load when this tab is shown
    document.addEventListener('DOMContentLoaded', () => {
        // Check if this tab is active on load, otherwise wait for click
        const recycleTab = document.querySelector('[data-tab="recycle"]');
        if(recycleTab && recycleTab.classList.contains('active')) {
            loadRecycleData();
        }
        
        // Also bind to the tab click in settings_page.html logic
        recycleTab?.addEventListener('click', loadRecycleData);
    });

    function switchRecycleTab(category, btn) {
        // UI Update
        document.querySelectorAll('.recycle-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // Data Fetch
        currentCategory = category;
        loadRecycleData();
    }

    function loadRecycleData() {
        const container = document.getElementById('recycleListContainer');
        container.innerHTML = `
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                <span class="ms-2">Loading...</span>
            </div>`;

        fetch(`/recycle-bin/data?category=${currentCategory}`)
            .then(res => res.json())
            .then(data => {
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-3"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            <p class="text-muted">Trash is empty.</p>
                        </div>
                    `;
                    return;
                }

                data.forEach(item => {
                    let iconSvg = getIconForType(item.type_slug);
                    
                    const html = `
                    <div class="recycle-card">
                        <div class="recycle-icon">${iconSvg}</div>
                        
                        <div class="recycle-content">
                            <div>
                                <a href="${item.view_url}" target="_blank" class="recycle-title" title="View Original Record">
                                    ${item.title} <sup style="color:#2563eb; font-size: 0.6em;">↗</sup>
                                </a>
                            </div>
                            <div class="recycle-meta">
                                <span class="badge-type">${item.type}</span>
                                <span>${item.subtitle}</span>
                                <span class="mx-1">&bull;</span>
                                <span class="text-danger">Deleted: ${item.deleted_at}</span>
                            </div>
                        </div>

                        <div class="recycle-actions">
                            <button class="btn btn-sm btn-outline-success d-flex align-items-center gap-1" 
                                onclick="restoreItem('${item.type_slug}', ${item.id})" title="Restore Item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
                                Restore
                            </button>
                            <button class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1" 
                                onclick="purgeItem('${item.type_slug}', ${item.id})" title="Delete Permanently">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                    </div>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => {
                console.error(err);
                container.innerHTML = `<div class="alert alert-danger text-center">Failed to load data.</div>`;
            });
    }

    function getIconForType(type) {
        if(type === 'client') return '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';
        if(type === 'case') return '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>';
        if(type === 'document') return '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>';
        if(type === 'entry') return '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>';
        return '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
    }

    function restoreItem(type, id) {
        if(!confirm('Restore this item? It will reappear in the main list.')) return;
        
        fetch(`/recycle-bin/restore/${type}/${id}`, {method: 'POST'})
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    loadRecycleData(); // Refresh list
                } else {
                    alert('Error: ' + data.error);
                }
            });
    }

    function purgeItem(type, id) {
        if(!confirm('PERMANENTLY DELETE? This cannot be undone.')) return;
        
        fetch(`/recycle-bin/purge/${type}/${id}`, {method: 'POST'})
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    loadRecycleData(); // Refresh list
                } else {
                    alert('Error: ' + data.error);
                }
            });
    }
</script>
